name: Nightly eval

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      llm:
        description: "Plan out-of-slice repos with the LLM"
        type: boolean
        default: false

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore previous report
        uses: actions/cache/restore@v4
        with:
          path: eval/baseline
          key: eval-baseline-${{ github.run_id }}
          restore-keys: eval-baseline-

      - name: Run corpus
        env:
          GITHUB_TOKEN: ${{ secrets.EVAL_GITHUB_TOKEN || github.token }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          MODE=offline
          ARGS="--concurrency 8"
          if [ "${{ inputs.llm }}" = "true" ]; then MODE=llm; ARGS="$ARGS --llm"; fi
          if [ -f "eval/baseline/eval-$MODE-latest.json" ]; then
            ARGS="$ARGS --baseline eval/baseline/eval-$MODE-latest.json --fail-on-regression"
          fi
          pnpm eval run -- $ARGS
          cat "eval/reports/eval-$MODE-latest.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p eval/baseline && cp eval/reports/eval-*-latest.json eval/baseline/

      - name: Save report as next baseline
        uses: actions/cache/save@v4
        with:
          path: eval/baseline
          key: eval-baseline-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
