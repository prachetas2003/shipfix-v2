name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the root package.json "packageManager" field.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (typecheck all packages)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Includes the golden-repo pipeline regression test
      # (analyze -> deterministic plan -> validate must stay deployable).
      - name: Test
        run: pnpm test

      # Fixture plans must not drop below the committed baseline. The full
      # corpus runs nightly and fails on the same kind of regression.
      - name: Eval (offline fixture corpus)
        run: pnpm eval run -- --category fixture --baseline eval/baselines/fixtures.json --fail-on-regression
